# Full local stack: API, worker, Postgres+pgvector, Redis.
#
#   docker compose up -d --build
#
# API and worker run the same image and differ only in command. Both wait
# for Postgres and Redis to report healthy — without that they start while
# the databases are still booting and crash on their first connection.

services:
  postgres:
    # pgvector/pgvector, not plain postgres: the stock image has no vector
    # extension and the chunks table cannot be created without it.
    image: pgvector/pgvector:pg16
    # `unless-stopped`, not `always`: a reboot or a crashed container comes
    # back on its own, which is what a deployed host needs, but a deliberate
    # `docker compose stop` stays stopped instead of being undone at boot.
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # Migrations run here, once, before the server binds. The worker does
    # not migrate — two processes racing on the same DDL is how you get a
    # half-applied schema.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"
    environment: &app_env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Service names, not localhost: inside the compose network each
      # container's localhost is itself.
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      # This block is the ONLY channel between the host's .env and the
      # containers: .dockerignore excludes .env, so nothing inside the image
      # ever reads that file. A setting added to app/config.py and left out
      # here is silently inert in every deployment — it does not warn, it
      # just runs on its default. Add new settings in both places.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-openai/gpt-oss-120b}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-0}
      TEMP_AUDIO_DIR: /var/spool/asr
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hf_cache:/cache/huggingface
      - audio_spool:/var/spool/asr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.workers.run
    environment: *app_env
    volumes:
      # hf_cache is shared with the API so the Whisper and MiniLM weights
      # download once, not once per service and not again on every restart.
      - hf_cache:/cache/huggingface
      # The API buffers uploads here and the worker reads them back; without
      # a shared volume the worker looks for a file that only exists in the
      # API container.
      - audio_spool:/var/spool/asr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not service_healthy: the worker does not need the API to be serving,
      # only to have run the migrations it is about to query against.
      api:
        condition: service_started

  demo:
    # Its own image and its own build context: ./demo, so the root
    # .dockerignore (which excludes demo/) never applies. See demo/Dockerfile.
    build: ./demo
    restart: unless-stopped
    environment:
      # The service name on the compose network, not the public hostname.
      # The demo's traffic to the API never leaves the machine, so the demo
      # key is not sent over the internet and does not need the proxy up to
      # work. Inside the network each container's localhost is itself.
      ASR_API_URL: http://api:8080
      # The demo key, with its low daily quota. Server-side only: Streamlit
      # renders on the server, so the browser never sees this value and the
      # public API is not callable directly by a visitor.
      ASR_API_KEY: ${DEMO_API_KEY:-}
      # Transcript ids from data/seed/nasa_corpus.sql. Defaulted rather than
      # required: any deployment that restores that seed has exactly these
      # rows, so the Summarize tab works with no extra configuration.
      DEMO_TRANSCRIPT_GATEWAY: ${DEMO_TRANSCRIPT_GATEWAY:-2db117b7-12b8-4842-8086-75c92507e9f7}
      DEMO_TRANSCRIPT_MICROBIOLOGY: ${DEMO_TRANSCRIPT_MICROBIOLOGY:-3069178a-f847-40fe-9e1c-9fbc5ea4fbf1}
      DEMO_TRANSCRIPT_APOLLO: ${DEMO_TRANSCRIPT_APOLLO:-387b1417-d6a6-4114-8602-28665589cfdb}
      # The same two values the API enforces, from the same .env, so the
      # Upload tab can state the limits before a visitor picks a file. Two
      # copies of one number would be a UI that lies as soon as either
      # moves; one source, read twice, cannot drift.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-0}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      # service_healthy, unlike the worker's dependency on the API: the demo
      # is nothing but calls to the API, so starting before it is serving
      # just shows a visitor an error.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pg_data:
  hf_cache:
  audio_spool:
